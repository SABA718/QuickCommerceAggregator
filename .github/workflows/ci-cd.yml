name: Production quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [backend, mvp]
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy main.py
      - run: python -m pytest
      - run: python -m compileall -q main.py

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dealdock_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: dealdock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U dealdock_test -d dealdock_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: dealdock_test
      PGPASSWORD: disposable-ci-only
      PGDATABASE: dealdock_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and verify repeatability
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/migrations/001_initial.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/002_security_constraints.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/001_initial.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/002_security_constraints.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/verify.sql

  containers:
    needs: [javascript, python, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [frontend, backend, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          build-args: |
            SITE_URL=https://dealdock.example.com
          tags: dealdock-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
